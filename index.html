
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money House Admin Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      color: #222;
    }
    .container {
      max-width: 500px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0001;
    }
    h2 { text-align: center; color: #176b45; }
    input, textarea, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    button {
      background: #176b45;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    .secondary { background: #555; }
    .hidden { display: none; }
    .task {
      padding: 12px;
      background: #f2f4f8;
      border-radius: 8px;
      margin: 10px 0;
    }
    #message { text-align: center; color: #b00020; }
  </style>
</head>
<body>

  <div class="container" id="loginBox">
    <h2>🏠 Money House</h2>
    <p style="text-align:center">Admin Login</p>
    <input id="email" type="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p id="message"></p>
  </div>

  <div class="container hidden" id="dashboard">
    <h2>🏠 Money House Admin</h2>
    <p>স্বাগতম, Admin!</p>
    <hr>
    <h3>নতুন Task তৈরি করুন</h3>
    <input id="taskTitle" placeholder="Task-এর নাম">
    <textarea id="taskDescription" placeholder="Task-এর বিবরণ"></textarea>
    <input id="taskReward" type="number" min="0" placeholder="Reward points">
    <button id="addTaskBtn">Task যোগ করুন</button>
    <p id="taskMessage"></p>

    <h3>Task তালিকা</h3>
    <div id="taskList">লোড হচ্ছে...</div>
    <button class="secondary" id="logoutBtn">Logout</button>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

    import {
      getAuth, signInWithEmailAndPassword,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    import {
      getFirestore, collection, addDoc,
      getDocs, serverTimestamp, query, orderBy
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIjsLSzFFflPK21i4xxV8Y58itLRxVP3s",
      authDomain: "money-house-c6e89.firebaseapp.com",
      projectId: "money-house-c6e89",
      storageBucket: "money-house-c6e89.firebasestorage.app",
      messagingSenderId: "333628767022",
      appId: "1:333628767022:web:7f588fc4eef9ba98c6d8bf"
    };

    const ADMIN_UID = "IYlMiOc6XWQLVrC3Hrwe9dfWjrV2";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginBox = document.getElementById("loginBox");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");

    document.getElementById("loginBtn").addEventListener("click", async () => {
      message.textContent = "লগইন হচ্ছে...";
      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        message.textContent = "লগইন হয়নি: " + error.message;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user && user.uid === ADMIN_UID) {
        loginBox.classList.add("hidden");
        dashboard.classList.remove("hidden");
        await loadTasks();
      } else {
        dashboard.classList.add("hidden");
        loginBox.classList.remove("hidden");
        if (user) {
          await signOut(auth);
          message.textContent = "এই অ্যাকাউন্টের Admin access নেই।";
        }
      }
    });

    document.getElementById("addTaskBtn").addEventListener("click", async () => {
      const title = document.getElementById("taskTitle").value.trim();
      const description = document.getElementById("taskDescription").value.trim();
      const reward = Number(document.getElementById("taskReward").value);
      const status = document.getElementById("taskMessage");

      if (!title || !description || !Number.isFinite(reward) || reward < 0) {
        status.textContent = "সব তথ্য সঠিকভাবে পূরণ করো।";
        return;
      }

      try {
        await addDoc(collection(db, "tasks"), {
          title,
          description,
          rewardPoints: reward,
          createdAt: serverTimestamp()
        });
        status.textContent = "Task যোগ হয়েছে!";
        document.getElementById("taskTitle").value = "";
        document.getElementById("taskDescription").value = "";
        document.getElementById("taskReward").value = "";
        await loadTasks();
      } catch (error) {
        status.textContent = "সমস্যা: " + error.message;
      }
    });

    async function loadTasks() {
      const list = document.getElementById("taskList");
      list.textContent = "লোড হচ্ছে...";
      try {
        const result = await getDocs(
          query(collection(db, "tasks"), orderBy("createdAt", "desc"))
        );
        list.innerHTML = "";
        if (result.empty) {
          list.textContent = "এখনো কোনো Task নেই।";
          return;
        }
        result.forEach((item) => {
          const data = item.data();
          const card = document.createElement("div");
          card.className = "task";
          const title = document.createElement("strong");
          title.textContent = data.title || "Untitled";
          const description = document.createElement("p");
          description.textContent = data.description || "";
          const reward = document.createElement("p");
          reward.textContent = "Reward points: " + (data.rewardPoints ?? 0);
          card.append(title, description, reward);
          list.appendChild(card);
        });
      } catch (error) {
        list.textContent = "Task লোড হয়নি: " + error.message;
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth);
    });
  </script>
</body>
</html>
